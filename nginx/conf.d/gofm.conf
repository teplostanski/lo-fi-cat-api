# Конфигурация для Lofi Cat

# Upstream для Go бэкенда
upstream lofi_cat_backend {
    server lofi-cat-backend:8090;
}

server {
    listen 80;
    server_name api-lofi.teplostanski.me;

    # Лимиты для больших файлов (аудио поток)
    client_max_body_size 0;
    client_body_timeout 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Статика фронтенда
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Кеширование статики
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API эндпоинты - проксируем на Go сервер
    # Информация о сервере
    location /info {
        proxy_pass http://lofi_cat_backend/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws {
        proxy_pass http://lofi_cat_backend/ws;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Таймауты для WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Аудио стрим
    location /fm {
        proxy_pass http://lofi_cat_backend/fm;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Отключаем буферизацию для стрима
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Информация о музыке
    location /fm/ {
        proxy_pass http://lofi_cat_backend/fm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Favicon
    location /favicon.ico {
        proxy_pass http://lofi_cat_backend/favicon.ico;
        proxy_set_header Host $host;
    }
}

